name: release

# Publish aa-auto-sdr to PyPI with OIDC trusted publishing. No API token lives
# in this repo. PyPI trusts this publisher:
#
#   owner=brian-a-au  repo=aa_auto_sdr  workflow=release.yml  environment=pypi
#
# Keep the file name `release.yml` and the `pypi` environment name, or PyPI
# rejects the upload with a mismatched-publisher error.
#
# A pushed tag vX.Y.Z runs every job. "Run workflow" (workflow_dispatch) is a
# dry run: it runs the build job only, and publish and github-release are
# skipped, so nothing is uploaded.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Each job asks for the scopes it needs. Everything else is none.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # The default (true) strips pre-built wheels from the saved cache,
          # so every run re-downloads them from PyPI despite a cache hit.
          prune-cache: false
          # Pin the interpreter. requires-python is >=3.11, so without this uv
          # would pick the runner's system Python (3.12 on ubuntu-latest).
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # The same checks as the required PR checks lint, lockfile and check.
      - name: Lint
        run: |
          uv run --locked ruff check src/ tests/ scripts/ benchmarks/
          uv run --locked ruff format --check src/ tests/ scripts/ benchmarks/

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Check version sync
        run: uv run --no-project python scripts/check_version_sync.py

      # The tests workflow runs every Python and OS on each push to main (PRs
      # run a trimmed matrix). This run is the last check on the exact commit
      # that gets released.
      - name: Test
        run: uv run --locked pytest -q -n auto

      # version.py is the single version source. check_version_sync.py above
      # already keeps pyproject.toml and the top CHANGELOG heading in line
      # with it.
      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/aa_auto_sdr/core/version.py)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse __version__ from src/aa_auto_sdr/core/version.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Stops a mistyped tag from publishing a mislabeled package.
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package version 'v$VERSION'"
            exit 1
          fi
          echo "tag matches package version: $GITHUB_REF_NAME"

      # Fails when CHANGELOG.md has no section for this version. The section
      # becomes the GitHub Release body.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python scripts/extract_release_notes.py "$VERSION" dist/RELEASE_NOTES.md

      - name: Build sdist and wheel
        run: uv build --out-dir dist/packages

      # PyPI shows the long description outside the repository, so relative
      # README links would point at pypi.org instead of GitHub.
      - name: Verify packaged README links
        run: uv run --no-project python scripts/check_distribution_readme_links.py dist/packages/*.whl dist/packages/*.tar.gz

      # Install the wheel into a new environment on every supported Python.
      # --seed puts pip in the venv so pip resolves the dependencies, as it
      # would for a user, instead of uv.lock. Keep this list in sync with the
      # pyproject classifiers; tests/meta/test_python_version_matrix.py checks it.
      - name: Smoke test the installed wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for py in 3.11 3.12 3.13 3.14 3.15; do
            venv="$RUNNER_TEMP/install_smoke_${py}"
            uv venv --python "$py" --seed "$venv"
            "$venv/bin/pip" install dist/packages/*.whl
            "$venv/bin/aa_auto_sdr" --help >/dev/null
            "$venv/bin/aa-auto-sdr" --help >/dev/null
            "$venv/bin/python" -m aa_auto_sdr --help >/dev/null
            "$venv/bin/aa_auto_sdr" --exit-codes >/dev/null
            reported="$("$venv/bin/aa_auto_sdr" -V)"
            if [ "$reported" != "aa_auto_sdr $VERSION" ]; then
              echo "::error::Installed wheel on $py reports '$reported', expected 'aa_auto_sdr $VERSION'"
              exit 1
            fi
          done

      - name: Generate SHA256SUMS
        run: cd dist/packages && sha256sum -- *.whl *.tar.gz > ../SHA256SUMS

      - name: Store verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: the PyPI publisher names this workflow and this
    # environment. The environment requires a reviewer and allows only v*.*.*
    # tags. The OIDC id-token below is the whole credential.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Fetch distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify distribution digests
        run: cd dist/packages && sha256sum -c ../SHA256SUMS

      # Pinned by commit SHA because this job holds id-token: write.
      - name: Upload distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/packages/

  github-release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify distribution digests
        run: cd dist/packages && sha256sum -c ../SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
            dist/SHA256SUMS

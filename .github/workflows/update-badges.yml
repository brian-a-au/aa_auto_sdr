name: update-badges

# Refresh the README's coverage % and test-count badges when they drift
# from the actual `tests` workflow run on main. Opens (or updates) a PR
# titled `chore: refresh README badges` when values change. Manual edits
# to the badges are not needed — let CI keep them honest.
#
# Branch protection on `main` rejects direct pushes from CI, so this
# workflow opens a PR via peter-evans/create-pull-request and the standard
# required-checks gate runs against the PR before a human merges it. If
# the values match main already (the common case after a normal merge),
# no PR is opened.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    # Only after a successful tests run for a push to main in this repo. The
    # `branches` filter matches the head branch name, so a fork PR from a
    # branch called `main` would also pass it; the event and repository
    # checks keep this write-capable job reading trusted runs only. On
    # workflow_dispatch the latest such run is looked up below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Read the test-metrics artifact from the tests run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read coverage + test count from the tests run
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # The tests workflow already measured both values (with its 90%
          # coverage gate) and uploaded them, so no second test run is needed.
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main \
              --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name test-metrics --dir "$RUNNER_TEMP/metrics"
          COVERAGE="$(sed -n 's/^coverage=//p' "$RUNNER_TEMP/metrics/test-metrics.txt")"
          TESTS="$(sed -n 's/^tests=//p' "$RUNNER_TEMP/metrics/test-metrics.txt")"
          # The values go into README.md, so accept plain integers only.
          if ! [[ "$COVERAGE" =~ ^[0-9]{1,3}$ && "$TESTS" =~ ^[0-9]+$ ]]; then
            echo "Unexpected metrics from run $RUN_ID: coverage='$COVERAGE' tests='$TESTS'"
            exit 1
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "Run $RUN_ID: coverage=$COVERAGE%, tests=$TESTS"

      - name: Update README badges in place
        env:
          COV: ${{ steps.stats.outputs.coverage }}
          TESTS: ${{ steps.stats.outputs.tests }}
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib

          cov = os.environ["COV"]
          tests = os.environ["TESTS"]
          path = pathlib.Path("README.md")
          src = path.read_text()

          # The shields.io URL pattern (`img.shields.io/badge/coverage-`,
          # `/badge/tests-`) is unique to the static-text badges; the GHA
          # tests-status badge uses `actions/workflows/tests.yml/badge.svg`
          # and is unaffected.
          src = re.sub(
              r"https://img\.shields\.io/badge/coverage-\d+%25-brightgreen\.svg",
              f"https://img.shields.io/badge/coverage-{cov}%25-brightgreen.svg",
              src,
          )
          src = re.sub(
              r"https://img\.shields\.io/badge/tests-\d+-brightgreen\.svg",
              f"https://img.shields.io/badge/tests-{tests}-brightgreen.svg",
              src,
          )
          path.write_text(src)
          PY

      - name: Open PR if badges changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Default GITHUB_TOKEN works because the repo grants `pull-requests: write`
          # on this job (see its permissions block above).
          commit-message: "chore: refresh README badges (coverage / test count)"
          title: "chore: refresh README badges"
          body: |
            Auto-generated by `update-badges` workflow.

            Latest values from the `tests` workflow on `main`:

            | Badge | Old (main) | New |
            |---|---|---|
            | Coverage | (see diff) | **${{ steps.stats.outputs.coverage }}%** |
            | Tests passed | (see diff) | **${{ steps.stats.outputs.tests }}** |

            If the diff is empty, this PR isn't opened — main already matches.
          branch: bot/update-badges
          delete-branch: true
          base: main
          add-paths: README.md

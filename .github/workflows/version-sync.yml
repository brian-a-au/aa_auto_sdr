name: version-sync
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's superseded runs; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # stdlib-only script, so nothing to install. The cache key does not
          # include the workflow, so saving here could claim the key the
          # `tests` job fills.
          enable-cache: false
          python-version: "3.14"
      - name: Check version sync
        run: uv run --no-project python scripts/check_version_sync.py

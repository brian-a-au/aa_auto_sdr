name: version-sync
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # The default (true) strips pre-built wheels from the saved cache,
          # so every run re-downloads them from PyPI despite a cache hit.
          prune-cache: false
          # Pin the interpreter. requires-python is >=3.11, so without this uv
          # would pick the runner's system Python (3.12 on ubuntu-latest).
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check version sync
        run: uv run --locked python scripts/check_version_sync.py

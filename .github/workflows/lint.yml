name: lint
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # The default (true) strips pre-built wheels from the saved cache,
          # so every run re-downloads them from PyPI despite a cache hit.
          prune-cache: false
          # Pin the interpreter. requires-python is >=3.11, so without this uv
          # would pick the runner's system Python (3.12 on ubuntu-latest).
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff check
        run: uv run --locked ruff check src/ tests/ scripts/ benchmarks/
      - name: Ruff format check
        run: uv run --locked ruff format --check src/ tests/ scripts/ benchmarks/
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # The default (true) strips pre-built wheels from the saved cache,
          # so every run re-downloads them from PyPI despite a cache hit.
          prune-cache: false
      - name: Verify lockfile is in sync
        run: uv lock --check

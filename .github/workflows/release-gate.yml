name: release-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # The default (true) strips pre-built wheels from the saved cache,
          # so every run re-downloads them from PyPI despite a cache hit.
          prune-cache: false
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Tests + coverage gate
        run: uv run pytest -q
      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Version sync
        run: uv run python scripts/check_version_sync.py
      - name: Build wheel + sdist
        run: uv build
      - name: Verify packaged README links
        run: uv run python scripts/check_distribution_readme_links.py dist/*.whl dist/*.tar.gz
      - name: Smoke-install the wheel
        run: |
          # Use uv-managed Python 3.14 (system python on GH runners is 3.12, below our >=3.14 floor).
          # --seed installs pip into the venv so we can use the same install path a real user would.
          uv venv --python 3.14 --seed /tmp/install_smoke
          /tmp/install_smoke/bin/pip install dist/*.whl
          /tmp/install_smoke/bin/aa_auto_sdr -V
          /tmp/install_smoke/bin/aa_auto_sdr --exit-codes

name: release-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's superseded runs; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `uv sync`: the required `test`, `lint` and `check` jobs already run
      # pytest, ruff and the version check on this commit. This job covers
      # only what they don't: build, packaged README links, and a pip install
      # on every supported Python. The job keeps its name because `gate` is a
      # required check.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The cache key does not include the workflow, so saving this job's
          # near-empty cache could claim the key the `tests` job fills.
          enable-cache: false
          python-version: "3.14"
      - name: Build wheel + sdist
        run: uv build
      - name: Verify packaged README links
        run: uv run --no-project python scripts/check_distribution_readme_links.py dist/*.whl dist/*.tar.gz
      - name: Smoke-install the wheel
        run: |
          set -euo pipefail
          # Install on every supported Python. --seed installs pip into the venv
          # so we use the same install path a real user would: pip resolves the
          # dependencies, not uv.lock. Keep this list in sync with the pyproject
          # classifiers; tests/meta/test_python_version_matrix.py checks it.
          for py in 3.11 3.12 3.13 3.14 3.15; do
            venv="/tmp/install_smoke_${py}"
            uv venv --python "$py" --seed "$venv"
            "$venv/bin/pip" install dist/*.whl
            "$venv/bin/aa_auto_sdr" -V
            "$venv/bin/aa_auto_sdr" --exit-codes
            "$venv/bin/python" -m aa_auto_sdr --help >/dev/null
          done
